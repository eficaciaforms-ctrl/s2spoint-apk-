name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio de la APK
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Empaquetar el app DENTRO de la APK (offline-first)
        run: |
          rm -rf www
          git clone --depth 1 https://github.com/eficaciaforms-ctrl/s2spointv2-test.git www
          rm -rf www/.git www/README.md
          echo "----- Contenido del app empaquetado -----"
          ls -la www

      - name: Instalar dependencias
        run: npm install

      - name: Agregar plataforma Android
        run: npx cap add android

      - name: Generar iconos desde icon.png
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android
            echo "Iconos generados OK"
          else
            echo "No hay icon.png, se usa el icono por defecto"
          fi

      - name: Sincronizar (copia app, plugins y config)
        run: npx cap sync android

      - name: Agregar permiso de camara al Manifest
        run: |
          python3 - <<'PY'
          ruta = "android/app/src/main/AndroidManifest.xml"
          with open(ruta, encoding="utf-8") as f:
              xml = f.read()
          perms = '    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          if "android.permission.CAMERA" not in xml:
              xml = xml.replace("<application", perms + "    <application", 1)
          with open(ruta, "w", encoding="utf-8") as f:
              f.write(xml)
          print(xml[:800])
          PY

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar la APK (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publicar la APK
        uses: actions/upload-artifact@v4
        with:
          name: Aspery-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
