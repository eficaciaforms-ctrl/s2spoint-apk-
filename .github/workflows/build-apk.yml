name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Agregar plataforma Android
        run: npx cap add android

      - name: Sincronizar (copia plugins y config)
        run: npx cap sync android

      - name: Agregar permiso de camara al Manifest
        run: |
          python3 - <<'PY'
          import re
          ruta = "android/app/src/main/AndroidManifest.xml"
          with open(ruta, encoding="utf-8") as f:
              xml = f.read()
          perms = '    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          if "android.permission.CAMERA" not in xml:
              xml = xml.replace("<application", perms + "    <application", 1)
          with open(ruta, "w", encoding="utf-8") as f:
              f.write(xml)
          print(xml)
          PY

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar la APK (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publicar la APK
        uses: actions/upload-artifact@v4
        with:
          name: S2S-Point-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
