name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio de la APK
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Empaquetar el app DENTRO de la APK (offline-first)
        run: |
          rm -rf www
          git clone --depth 1 https://github.com/eficaciaforms-ctrl/s2spointv2-test.git www
          rm -rf www/.git www/README.md
          echo "----- Contenido del app empaquetado -----"
          ls -la www

      - name: Ofuscar el codigo del app (proteccion)
        run: |
          npm install -g javascript-obfuscator || true
          for archivo in www/app.js www/config.js www/base_pdv.js; do
            if [ -f "$archivo" ]; then
              javascript-obfuscator "$archivo" --output "$archivo" \
                --compact true --control-flow-flattening true \
                --dead-code-injection true --string-array true \
                --string-array-encoding base64 --self-defending true || echo "ofuscacion omitida en $archivo"
            fi
          done
          echo "Ofuscacion completada"

      - name: Instalar dependencias
        run: npm install

      - name: Agregar plataforma Android
        run: npx cap add android

      - name: Generar iconos desde icon.png
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android || echo "iconos: continuo"
          else
            echo "No hay icon.png"
          fi

      - name: Sincronizar (copia app, plugins y config)
        run: npx cap sync android

      - name: Agregar permisos (camara + ubicacion + seguimiento en vivo) al Manifest
        run: |
          python3 - <<'PY'
          ruta = "android/app/src/main/AndroidManifest.xml"
          with open(ruta, encoding="utf-8") as f:
              xml = f.read()

          # Permisos que necesita la APK. El rastreo nativo (seguimiento en vivo)
          # necesita ubicacion en segundo plano + servicio en primer plano + notificacion.
          permisos = [
              'android.permission.CAMERA',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_BACKGROUND_LOCATION',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.WAKE_LOCK',
          ]
          bloque = ''
          for p in permisos:
              if p not in xml:
                  bloque += '    <uses-permission android:name="%s" />\n' % p
          # La camara ademas declara un feature opcional
          if 'android.hardware.camera' not in xml:
              bloque += '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'

          if bloque:
              xml = xml.replace("<application", bloque + "    <application", 1)

          with open(ruta, "w", encoding="utf-8") as f:
              f.write(xml)
          print("permisos agregados ok")
          PY

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Subir a compileSdk 35 (lo exige el motor OTA; targetSdk queda en 34)
        run: |
          python3 - <<'PY'
          import re

          # 1) compileSdk a 35 (dejamos targetSdk en 34 para no cambiar comportamiento)
          vg = "android/variables.gradle"
          s = open(vg, encoding="utf-8").read()
          s = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 35', s)
          open(vg, "w", encoding="utf-8").write(s)
          print("variables.gradle -> compileSdk 35")

          # 2) Android Gradle Plugin a una version que soporta 35
          bg = "android/build.gradle"
          s = open(bg, encoding="utf-8").read()
          s = re.sub(r"com\.android\.tools\.build:gradle:[0-9.]+",
                     "com.android.tools.build:gradle:8.7.2", s)
          open(bg, "w", encoding="utf-8").write(s)
          print("build.gradle -> AGP 8.7.2")

          # 3) Gradle wrapper a una version compatible con ese AGP
          wp = "android/gradle/wrapper/gradle-wrapper.properties"
          s = open(wp, encoding="utf-8").read()
          s = re.sub(r"gradle-[0-9.]+-(all|bin)\.zip", "gradle-8.9-all.zip", s)
          open(wp, "w", encoding="utf-8").write(s)
          print("gradle-wrapper -> Gradle 8.9")
          PY
          echo "----- variables.gradle -----"; grep -E "compileSdkVersion|targetSdkVersion" android/variables.gradle
          echo "----- AGP -----"; grep "com.android.tools.build:gradle" android/build.gradle
          echo "----- wrapper -----"; grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Firma fija (misma firma en todas las APK → instalar encima sin desinstalar)
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
            echo "Firma fija instalada ✓"
          else
            echo "ADVERTENCIA: falta el secreto DEBUG_KEYSTORE_B64 → se usará una firma aleatoria (habrá que desinstalar para actualizar)."
          fi

      - name: Compilar la APK (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publicar la APK
        uses: actions/upload-artifact@v4
        with:
          name: Aspery-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
